url: https://dickoa.gitlab.io/samplyr
template:
  bootstrap: 5
  math-rendering: mathjax

articles:
  - title: "Getting Started"
    contents:
      - introduction
  - title: "Statistical Foundations"
    contents:
      - design-semantics
      - validation
  - title: "Analysis and Coordination"
    contents:
      - survey-analysis
      - sampling-coordination
      - rotating-panels
  - title: "Sharing and Reproducibility"
    contents:
      - serialization
  - title: "Survey Planning"
    contents:
      - survey-planning

reference:
  - title: "Design Specification"
    desc: "Build a sampling design step by step."
    contents:
      - sampling_design
      - stratify_by
      - cluster_by
      - draw
      - add_stage

  - title: "Execution"
    desc: "Execute designs and validate frames."
    contents:
      - execute
      - validate_frame
      - execution-conditions

  - title: "Panels and Rotation"
    desc: >
      Longitudinal designs: split an executed master into panels, materialize
      the wave each panel is scheduled for, and assemble the waves.
    contents:
      - rotation_program
      - stack_waves
      - as.data.frame.rotation_wave

  - title: "Reference topics"
    desc: >
      Cross-cutting contracts several functions share. Each is the canonical
      description; the function pages link here rather than restate it.
    contents:
      - selection-methods
      - sample-columns
      - frame-input-grammar

  - title: "Survey Export"
    desc: "Convert samples to survey/srvyr objects for analysis."
    contents:
      - as_svydesign
      - as_svrepdesign
      - as_survey_design.tbl_sample
      - as_survey_rep.tbl_sample

  - title: "Diagnostics"
    desc: "Summarize and inspect sampling results."
    contents:
      - summary.tbl_sample
      - frame_summary
      - joint_expectation
      - design_effect
      - varcomp.tbl_sample
      - effective_n

  - title: "Serialization"
    desc: "Save, share, and restore designs as JSON files."
    contents:
      - write_design
      - design_json
      - replay_design
      - as.list.sampling_design

  - title: "Helpers"
    desc: "Sorting and class checks."
    contents:
      - serp
      - bound
      - is_sampling_design
      - is_tbl_sample
      - as_tbl_sample
      - get_design
      - get_stages_executed
      - print.samplyr
      - "`[.tbl_sample`"

  - title: "Extension API"
    desc: >
      For packages built on the frame digest. The digest list structure is
      internal and versioned, so pin a minimum samplyr version.
    contents:
      - digest
      - get_frame_digest
      - exante_digest

  - title: "Datasets"
    desc: "Survey frames derived from public data, for learning and testing."
    contents:
      - samplyr-datasets
      - bfa_eas
      - bfa_eas_variance
      - bfa_eas_cost
      - zwe_eas
      - ken_enterprises
